<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta
      name="description"
      content="Turn any image into a perforated postage stamp. Everything stays in your browser."
    />
    <title>stamps</title>
    <link rel="icon" href="favicon.svg" />
    <link rel="stylesheet" href="stamps.css" />
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <a
          class="back"
          href="../index.html"
          aria-label="Back to pretty little things"
          title="Back"
        >
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M10.5 3.5 6 8l4.5 4.5" />
          </svg>
        </a>
        <h1>stamps</h1>
        <p class="tagline">Any image, perforated.</p>
      </header>

      <main class="app">
        <section class="panel" aria-label="Stamp settings">
          <div class="field">
            <div class="field-head">
              <span>Image</span>
              <button id="reset" class="quiet" type="button">reset</button>
            </div>
            <button id="source" class="source" type="button" title="Choose an image">
              <canvas id="thumb" width="72" height="88" aria-hidden="true"></canvas>
              <span class="source-text">
                <strong id="source-name">sample · dunes</strong>
                <small>click, drop, or paste to replace</small>
              </span>
              <span class="source-plus" aria-hidden="true">+</span>
            </button>
            <input id="file" type="file" accept="image/*" hidden />
          </div>

          <div class="field">
            <div class="field-head">
              <label for="notches">perforations</label>
              <output id="notches-out" for="notches">11</output>
            </div>
            <input id="notches" type="range" min="6" max="24" step="1" value="11" />
          </div>

          <div class="field">
            <div class="field-head">
              <label for="hole">hole size</label>
              <output id="hole-out" for="hole">34%</output>
            </div>
            <input id="hole" type="range" min="16" max="48" step="1" value="34" />
          </div>

          <div class="field">
            <div class="field-head">
              <label for="margin">paper border</label>
              <output id="margin-out" for="margin">6%</output>
            </div>
            <input id="margin" type="range" min="0" max="16" step="0.5" value="6" />
          </div>

          <div class="field">
            <div class="field-head"><span id="paper-label">paper</span></div>
            <div
              id="papers"
              class="swatches"
              role="group"
              aria-labelledby="paper-label"
            ></div>
          </div>

          <div class="actions">
            <button id="download" class="download" type="button">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M8 2v8m0 0 3-3m-3 3L5 7M3 13h10" />
              </svg>
              download sheet
            </button>
            <button id="download-stamp" class="download-alt" type="button">
              or just the stamp
            </button>
            <p class="hint">white sheet · stamp above original</p>
          </div>
        </section>

        <section class="stage" aria-label="Stamp preview">
          <div class="stage-inner">
            <canvas
              id="preview"
              tabindex="0"
              aria-label="Generated stamp. Click to crop the image."
            ></canvas>
            <div class="stage-caption">
              <p class="meta" id="meta"></p>
              <button id="crop-open" class="stage-crop" type="button">
                <svg viewBox="0 0 16 16" aria-hidden="true">
                  <path d="M4.5 2v9.5H14M2 4.5h9.5V14" />
                </svg>
                crop image
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div class="crop-modal" id="crop-modal" hidden>
      <div
        id="crop-dialog"
        class="crop-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="crop-title"
        tabindex="-1"
      >
        <div class="crop-head">
          <h2 id="crop-title">crop image</h2>
          <button
            id="crop-close"
            class="crop-close"
            type="button"
            aria-label="Cancel crop"
          >
            ×
          </button>
        </div>
        <div class="crop-stage">
          <canvas
            id="crop-canvas"
            aria-label="Crop editor. Drag inside the box to move it; drag a corner or edge to resize."
          ></canvas>
        </div>
        <div class="crop-foot">
          <div class="crop-note">
            <p class="crop-tip">drag the box to move · drag a corner to resize</p>
            <p class="crop-readout" id="crop-readout"></p>
          </div>
          <div class="crop-buttons">
            <button id="crop-reset" class="quiet" type="button">reset</button>
            <button id="crop-cancel" class="crop-cancel" type="button">cancel</button>
            <button id="crop-apply" class="crop-apply" type="button">
              apply crop
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="drop" id="drop" hidden><span>drop to print</span></div>
    <p class="status" id="status" role="status" aria-live="polite"></p>

    <script src="stamps.js"></script>
  </body>
</html>
